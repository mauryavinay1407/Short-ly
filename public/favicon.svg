<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Modern dark background -->
  <rect width="64" height="64" rx="16" fill="#1a1a1a" />
  
  <!-- Link chain concept -->
  <!-- First link (long) -->
  <rect x="8" y="20" width="16" height="8" rx="4" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  
  <!-- Breaking point with spark effect -->
  <circle cx="32" cy="24" r="2" fill="#ffd93d">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M30 22 L34 26 M30 26 L34 22" stroke="#ffd93d" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Second link (short) -->
  <rect x="40" y="20" width="16" height="8" rx="4" fill="none" stroke="#4ecdc4" stroke-width="3"/>
  
  <!-- "ly" text integrated into design -->
  <text x="32" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ly</text>
  
  <!-- Cutting/shortening scissors icon -->
  <g transform="translate(28, 32)">
    <path d="M2 2 L6 6 M6 2 L2 6" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1" cy="1" r="1.5" fill="none" stroke="#ff6b6b" stroke-width="1"/>
    <circle cx="7" cy="7" r="1.5" fill="none" stroke="#ff6b6b" stroke-width="1"/>
  </g>
</svg>